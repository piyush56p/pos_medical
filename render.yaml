services:
  - type: web
    name: pharmaspot-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:web
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmaspot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: pharmaspot-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: pharmaspot-db
    databaseName: pharmaspot
    user: pharmaspot
    plan: free
    region: singapore