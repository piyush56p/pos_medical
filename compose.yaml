services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaspot}
      POSTGRES_USER: ${POSTGRES_USER:-pharmaspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3210"
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-pharmaspot}
      PGUSER: ${POSTGRES_USER:-pharmaspot}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      OWNER_USERNAME: ${OWNER_USERNAME:?Set OWNER_USERNAME in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env}
      OWNER_NAME: ${OWNER_NAME:-PharmaSpot Owner}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to a domain pointed at this VPS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data:
  caddy-data:
  caddy-config: